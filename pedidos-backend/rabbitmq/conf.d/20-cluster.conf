# Clúster de RabbitMQ de Pedidos360: dos nodos que se descubren con una lista fija (classic_config).
# Solo lo monta rabbitmq-nodo2: al arrancar por primera vez encuentra a rabbit@rabbitmq y se une a su clúster.
# El nodo 1 arranca sin descubrimiento; si lo usara, quedaría esperando a un nodo 2 que todavía no existe.
# Se monta en /etc/rabbitmq/conf.d/ para sumarse a la configuración por defecto de la imagen sin reemplazarla.
# Los nombres de nodo son rabbit@<hostname>; los hostname se fijan en docker-compose.yml.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-nodo2
