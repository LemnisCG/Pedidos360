server:
  port: ${CATALOGO_PORT:8084}
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name:pedidos360}-stream
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  application:
    name: msvc-catalogo
  datasource:
    url: ${CATALOGO_DB_URL:jdbc:postgresql://localhost:5436/catalogo_db}
    username: ${CATALOGO_DB_USER:postgres}
    password: ${CATALOGO_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
services:
  producto-url: ${PRODUCTO_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
