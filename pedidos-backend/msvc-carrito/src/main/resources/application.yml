spring:
  application:
    name: msvc-carrito

  datasource:
    url: jdbc:postgresql://localhost:5432/carrito_db
    username: postgres
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8083
