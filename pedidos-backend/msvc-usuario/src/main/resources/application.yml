server:
  port: ${USUARIO_PORT:8081}

spring:
  application:
    name: msvc-usuario
  datasource:
    url: ${USUARIO_DB_URL:jdbc:postgresql://localhost:5433/usuario_db}
    username: ${USUARIO_DB_USER:postgres}
    password: ${USUARIO_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
