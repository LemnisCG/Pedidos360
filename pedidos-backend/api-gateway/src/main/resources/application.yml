server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # Con el issuer, Spring descarga las claves públicas (JWKS) de Entra y valida firma, emisor y vigencia.
          issuer-uri: ${ENTRA_EXTERNAL_ID_ISSUER_URI:https://92aabe28-d724-4ac3-a20c-45088143bf29.ciamlogin.com/92aabe28-d724-4ac3-a20c-45088143bf29/v2.0}
          # El claim "aud" debe ser el Client ID de la API: rechaza tokens emitidos para otra aplicación.
          audiences: ${ENTRA_EXTERNAL_ID_API_AUDIENCE:6314fdda-9417-40f2-8ebe-9cc6ef7cd4ed}

pedidos360:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  security:
    # Scope expuesto en "Expose an API"; llega en el claim "scp" del access token.
    required-access-token-scope: ${ENTRA_EXTERNAL_ID_REQUIRED_SCOPE:BFF.Access}
  services:
    usuario: ${USUARIO_URL:http://localhost:8081}
    producto: ${PRODUCTO_URL:http://localhost:8082}
    carrito: ${CARRITO_URL:http://localhost:8083}
    catalogo: ${CATALOGO_URL:http://localhost:8084}
    pago: ${PAGO_URL:http://localhost:8085}
    envio: ${ENVIO_URL:http://localhost:8086}
