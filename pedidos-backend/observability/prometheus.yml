global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: pedidos360-spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["msvc-pago:8085", "msvc-envio:8086", "msvc-catalogo:8084"]
