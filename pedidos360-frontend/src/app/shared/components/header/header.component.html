<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/"><img src="/assets/icons/camion-de-reparto.png" alt=""/><span>Pedidos<span>360</span></span></a>
    <nav class="main-nav" aria-label="Navegación principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Tienda</a>
      <a routerLink="/orders" routerLinkActive="active">Mis pedidos</a>
    </nav>
    <div class="actions">
      @if (auth.user(); as user) {
        <details class="user-menu">
          <summary class="user-trigger"><span class="avatar">{{ user.nombre.charAt(0) }}</span><span class="user-name">{{ user.nombre }} {{ user.apellido }}</span><span class="chevron">⌃</span></summary>
          <div class="user-popover">
            <div class="status"><strong>Estado:</strong> Sesión Activa <span class="check">✓</span></div>
            <div><strong>Usuario:</strong> {{ user.nombre }} {{ user.apellido }}</div>
            <small>{{ user.email }}</small>
            <div class="provider"><span>Proveedor</span><b>{{ user.provider }}</b></div>
          </div>
        </details>
        <button class="link-btn" (click)="logout()">Salir</button>
      } @else {
        <button class="link-btn" (click)="auth.open('login')">Iniciar sesión</button>
        <button class="signup" (click)="auth.open('register')">Crear cuenta</button>
      }
      <a class="cart" routerLink="/cart" aria-label="Carrito"><span>🛒</span><b>{{ cart.count() }}</b></a>
    </div>
  </div>
</header>
