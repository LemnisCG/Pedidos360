<section class="detail page-container"> <app-back-button></app-back-button>
@if(product();as p){<div class="detail-grid"><div class="poster"><img [src]="p.imagenUrl" [alt]="p.nombre"/></div><div class="copy"><span class="category">{{p.categoria}}</span><h1>{{p.nombre}}</h1><p class="desc">{{p.descripcion}}</p><strong class="price">{{p.precio|currency:'CLP':'symbol-narrow':'1.0-0':'es-CL'}}</strong><button class="primary-action" [disabled]="busy()||p.stock<1" (click)="add()">{{p.stock<1?'Sin stock':busy()?'Agregando...':'Agregar al carrito'}}</button><div class="facts"><span>Fecha de lanzamiento: <b>{{p.fechaLanzamiento|date:'dd-MM-yyyy'}}</b></span><span>Stock disponible: <b>{{p.stock}}</b></span></div></div></div>}
</section>
