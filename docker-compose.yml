name: pedidos360

services:
  # Base de datos exclusiva del microservicio de usuarios.
  db-usuario:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: usuario_db
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d usuario_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - usuario_data:/var/lib/postgresql/data

  # Base de datos exclusiva del microservicio de productos.
  db-producto:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: producto_db
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d producto_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - producto_data:/var/lib/postgresql/data

  # Base de datos exclusiva del carrito.
  db-carrito:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carrito_db
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d carrito_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - carrito_data:/var/lib/postgresql/data

  # Base de datos exclusiva para configuración de catálogo/banner.
  db-catalogo:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalogo_db
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d catalogo_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - catalogo_data:/var/lib/postgresql/data

  # Pago también conserva la orden/historial de compra para evitar un octavo servicio.
  db-pago:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pago_db
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d pago_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pago_data:/var/lib/postgresql/data

  # Base de datos exclusiva para registro de envíos/notificaciones.
  db-envio:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: envio_db
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d envio_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - envio_data:/var/lib/postgresql/data

  # Broker de mensajería para comunicación asíncrona entre microservicios.
  # Nodo 1 del clúster (rabbit@rabbitmq). Conserva el nombre de servicio al que ya se conectan los microservicios.
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      # Ambos nodos deben compartir la misma Erlang cookie para unirse al clúster.
      RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE:-pedidos360-cookie-del-cluster-rabbitmq}"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      # Se ejecuta como el usuario rabbitmq: como root, el chequeo puede crear .erlang.cookie antes que
      # el broker y dejarlo sin permiso de lectura, con lo que RabbitMQ no arranca la primera vez.
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Nodo 2 del clúster (rabbit@rabbitmq-nodo2). Arranca cuando el nodo 1 está sano y se une a él
  # con el descubrimiento de 20-cluster.conf; el nodo 1 no lo monta para no quedar esperando al nodo 2.
  rabbitmq-nodo2:
    image: rabbitmq:3-management
    hostname: rabbitmq-nodo2
    environment:
      RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE:-pedidos360-cookie-del-cluster-rabbitmq}"
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_nodo2_data:/var/lib/rabbitmq
      - ./pedidos-backend/rabbitmq/conf.d/20-cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

  msvc-usuario:
    build:
      context: ./pedidos-backend/msvc-usuario
    environment:
      USUARIO_DB_URL: jdbc:postgresql://db-usuario:5432/usuario_db
      USUARIO_DB_USER: "${POSTGRES_USER:-postgres}"
      USUARIO_DB_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    depends_on:
      db-usuario:
        condition: service_healthy

  msvc-producto:
    build:
      context: ./pedidos-backend/msvc-producto
    environment:
      PRODUCTO_DB_URL: jdbc:postgresql://db-producto:5432/producto_db
      PRODUCTO_DB_USER: "${POSTGRES_USER:-postgres}"
      PRODUCTO_DB_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    depends_on:
      db-producto:
        condition: service_healthy

  msvc-carrito:
    build:
      context: ./pedidos-backend/msvc-carrito
    environment:
      CARRITO_DB_URL: jdbc:postgresql://db-carrito:5432/carrito_db
      CARRITO_DB_USER: "${POSTGRES_USER:-postgres}"
      CARRITO_DB_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    depends_on:
      db-carrito:
        condition: service_healthy

  msvc-catalogo:
    build:
      context: ./pedidos-backend/msvc-catalogo
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      CATALOGO_DB_URL: jdbc:postgresql://db-catalogo:5432/catalogo_db
      CATALOGO_DB_USER: "${POSTGRES_USER:-postgres}"
      CATALOGO_DB_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      PRODUCTO_URL: http://msvc-producto:8082
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      db-catalogo:
        condition: service_healthy
      msvc-producto:
        condition: service_started

  msvc-envio:
    build:
      context: ./pedidos-backend/msvc-envio
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      ENVIO_DB_URL: jdbc:postgresql://db-envio:5432/envio_db
      ENVIO_DB_USER: "${POSTGRES_USER:-postgres}"
      ENVIO_DB_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      MAIL_ENABLED: "${MAIL_ENABLED:-true}"
      MAIL_HOST: "${MAIL_HOST:-smtp.gmail.com}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-no-reply@pedidos360.local}"
      FRONTEND_PUBLIC_URL: "${FRONTEND_PUBLIC_URL:-http://localhost:4200}"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_ADDRESSES: rabbitmq:5672,rabbitmq-nodo2:5672
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      db-envio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  msvc-pago:
    build:
      context: ./pedidos-backend/msvc-pago
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      PAGO_DB_URL: jdbc:postgresql://db-pago:5432/pago_db
      PAGO_DB_USER: "${POSTGRES_USER:-postgres}"
      PAGO_DB_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      PRODUCTO_URL: http://msvc-producto:8082
      CARRITO_URL: http://msvc-carrito:8083
      ENVIO_URL: http://msvc-envio:8086
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_ADDRESSES: rabbitmq:5672,rabbitmq-nodo2:5672
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      db-pago:
        condition: service_healthy
      msvc-producto:
        condition: service_started
      msvc-carrito:
        condition: service_started
      msvc-envio:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # Administración de RabbitMQ vía API REST (colas, exchanges, bindings).
  msvc-rabbitmq-admin:
    build:
      context: ./pedidos-backend/msvc-rabbitmq-admin
    environment:
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8090:8090"
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Gateway sin base de datos: es deliberadamente stateless y solo enruta/valida el access token de Entra.
  # Es el único servicio con puerto publicado: los microservicios solo son alcanzables a través de él.
  api-gateway:
    build:
      context: ./pedidos-backend/api-gateway
    environment:
      GATEWAY_PORT: "8080"
      ENTRA_EXTERNAL_ID_ISSUER_URI: "${ENTRA_EXTERNAL_ID_ISSUER_URI:-https://92aabe28-d724-4ac3-a20c-45088143bf29.ciamlogin.com/92aabe28-d724-4ac3-a20c-45088143bf29/v2.0}"
      ENTRA_EXTERNAL_ID_API_AUDIENCE: "${ENTRA_EXTERNAL_ID_API_AUDIENCE:-6314fdda-9417-40f2-8ebe-9cc6ef7cd4ed}"
      ENTRA_EXTERNAL_ID_REQUIRED_SCOPE: "${ENTRA_EXTERNAL_ID_REQUIRED_SCOPE:-BFF.Access}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:4200}"
      USUARIO_URL: http://msvc-usuario:8081
      PRODUCTO_URL: http://msvc-producto:8082
      CARRITO_URL: http://msvc-carrito:8083
      CATALOGO_URL: http://msvc-catalogo:8084
      PAGO_URL: http://msvc-pago:8085
      ENVIO_URL: http://msvc-envio:8086
    ports:
      - "8080:8080"
    depends_on:
      - msvc-usuario
      - msvc-producto
      - msvc-carrito
      - msvc-catalogo
      - msvc-pago
      - msvc-envio


  frontend:
    build:
      context: ./pedidos360-frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.7.1
    environment: &zk-env
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    volumes:
      - zk1_data:/var/lib/zookeeper/data
      - zk1_log:/var/lib/zookeeper/log
  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zk2_data:/var/lib/zookeeper/data
      - zk2_log:/var/lib/zookeeper/log
  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zk3_data:/var/lib/zookeeper/data
      - zk3_log:/var/lib/zookeeper/log

  kafka-1:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-1
    volumes:
      - kafka1_data:/var/lib/kafka/data

  kafka-2:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-2
    volumes:
      - kafka2_data:/var/lib/kafka/data

  kafka-3:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-3
    volumes:
      - kafka3_data:/var/lib/kafka/data

  
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    entrypoint: ["/bin/bash", "/scripts/init-topics.sh"]
    volumes:
      - ./pedidos-backend/kafka/init-topics.sh:/scripts/init-topics.sh:ro
    restart: "on-failure:5"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    restart: unless-stopped
    command:
      - --kafka.server=kafka-1:9092
      - --kafka.server=kafka-2:9092
      - --kafka.server=kafka-3:9092
      - --topic.filter=.*
      - --group.filter=.*
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./pedidos-backend/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

 
  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-pedidos360}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-pedidos360}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./pedidos-backend/observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./pedidos-backend/observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./pedidos-backend/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus


volumes:
  usuario_data:
  producto_data:
  carrito_data:
  catalogo_data:
  pago_data:
  envio_data:
  rabbitmq_data:
  rabbitmq_nodo2_data:
  zk1_data:
  zk1_log:
  zk2_data:
  zk2_log:
  zk3_data:
  zk3_log:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  prometheus_data:
  grafana_data:
